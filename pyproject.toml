[project]
name = "cv-label-audit"
version = "0.1.0"
description = "Finds label errors in an object-detection dataset with a detector, stores findings in SQLite, and measures the audit against injected errors."
requires-python = ">=3.12"
dependencies = ["onnxruntime>=1.18", "numpy>=1.26", "pillow>=10.0"]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
